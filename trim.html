<!doctype html>
<!-- optima save · the trim window. Runs inside the helper (WebView2, InPrivate, no devtools, no
     navigation away). The helper fills in DATA and FONT; everything the site supplied (the title,
     the video address) arrives as JSON data and is only ever used as text or as the video's src. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; media-src https://optima-save.trim; img-src data:">
<title>optima save · trim</title>
<style>
  @font-face { font-family: Inter; src: url(/*FONT*/) format('woff2'); font-weight: 100 900; }
  :root {
    --plastic: #e7e3dd; --plastic-hi: #efebe6; --plastic-lo: #dcd7cf;
    --hi: rgba(255,255,255,.92); --lo: rgba(158,147,133,.5);
    --ink: #2b2926; --ink-2: #5d5852; --muted: #8e877e; --ring: #34312d; --blue: #2a47c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plastic); color: var(--ink); overflow: hidden; user-select: none;
    font: 13px/1.4 Inter, "Segoe UI", system-ui, sans-serif; font-feature-settings: "cv11", "ss01"; }
  body { display: flex; flex-direction: column; gap: 14px; padding: 16px 22px 14px; }

  header { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 46px; height: auto; display: block; }
  .mark { display: flex; flex-direction: column; gap: 3px; }
  .mark i { display: block; width: 7px; height: 7px; border-radius: 50%; }
  .mark i:nth-child(1) { border: 1.4px solid var(--ink); }
  .mark i:nth-child(2) { background: var(--blue); }
  .mark i:nth-child(3) { background: #141312; }
  .word { font-size: 15px; letter-spacing: -.035em; text-shadow: 1px 1px 0 #fff; white-space: nowrap; }
  .word span { font-weight: 300; } .word b { font-weight: 700; }
  .title { flex: 1; min-width: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .screen { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 18px;
    border-radius: 26px; background: radial-gradient(ellipse at 50% 40%, #ddd7ce, #d1cac0);
    box-shadow: inset 9px 9px 20px rgba(150,138,123,.55), inset -9px -9px 20px var(--hi); }
  video { max-width: 100%; max-height: 100%; border-radius: 3px; background: #000; box-shadow: 0 6px 18px rgba(60,50,40,.28); }
  video.hidden { visibility: hidden; }
  .loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); }
  .loading .mark { transform: scale(1.6); }
  .loading.gone { display: none; }

  .timeline { position: relative; height: 34px; margin: 0 8px; cursor: pointer; }
  .groove { position: absolute; left: 0; right: 0; top: 13px; height: 8px; border-radius: 999px;
    box-shadow: inset 2px 2px 5px var(--lo), inset -2px -2px 5px var(--hi); }
  .range { position: absolute; top: 13px; height: 8px; border-radius: 999px; background: var(--blue); }
  .head { position: absolute; top: 2px; width: 2px; height: 30px; margin-left: -1px; border-radius: 1px; background: var(--ink); pointer-events: none; }
  .knob { position: absolute; top: 4px; width: 16px; height: 26px; margin-left: -8px; border-radius: 8px; cursor: ew-resize;
    background: linear-gradient(145deg, var(--plastic-hi), var(--plastic-lo)); border: 1.4px solid var(--ring);
    box-shadow: -2px -2px 5px var(--hi), 2px 2px 6px var(--lo); transition: border-color .15s; }
  .knob:hover, .knob.drag { border-color: var(--blue); }

  .row { display: flex; align-items: center; gap: 10px; }
  .spacer { flex: 1; }
  .chip { padding: 5px 11px; border-radius: 999px; color: var(--ink-2); font-size: 12px; white-space: nowrap;
    box-shadow: inset 2px 2px 5px var(--lo), inset -2px -2px 5px var(--hi); }
  .chip b { color: var(--blue); font-weight: 600; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  .key, .pill { border: 1.4px solid var(--ring); background: linear-gradient(145deg, var(--plastic-hi), var(--plastic-lo));
    box-shadow: -4px -4px 9px var(--hi), 4px 4px 10px var(--lo); transition: transform .15s, box-shadow .15s, color .15s; }
  .key { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
  .key:hover { color: var(--blue); }
  .pill { height: 36px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    box-shadow: -4px -4px 9px var(--hi), 4px 4px 10px var(--lo), 0 0 0 3px rgba(255,255,255,.35); }
  .pill:hover { transform: translateY(-1px); }
  .key:active, .pill:active { transform: none; box-shadow: inset 5px 5px 11px var(--lo), inset -5px -5px 11px var(--hi); }
  .pill.blue { color: var(--blue); border-color: var(--blue); }
  .pill kbd { font: inherit; font-size: 11px; color: var(--muted); }
  .pill:disabled { opacity: .42; box-shadow: none; transform: none; cursor: default; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .hint { color: var(--muted); font-size: 11.5px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .key, .pill, .knob { transition: none; } }
</style>
</head>
<body>
  <header>
    <img class="logo" src="/*LOGO*/" alt="">
    <span class="word"><span>optima</span> <b>save</b></span>
    <span class="title" id="title"></span>
  </header>

  <div class="screen">
    <video id="video" class="hidden" preload="auto" playsinline disablepictureinpicture></video>
    <div class="loading" id="loading"><span class="mark"><i></i><i></i><i></i></span><span id="status">loading the preview</span></div>
  </div>

  <div class="timeline" id="timeline">
    <div class="groove"></div>
    <div class="range" id="range"></div>
    <div class="head" id="head"></div>
    <div class="knob" id="knobIn" title="start (I)"></div>
    <div class="knob" id="knobOut" title="end (O)"></div>
  </div>

  <div class="row">
    <button class="key" id="play" title="play / pause (space)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
    <span class="chip">start <b id="tIn">0:00.0</b></span>
    <span class="chip">end <b id="tOut">0:00.0</b></span>
    <span class="chip">length <b id="tLen">0:00.0</b></span>
    <span class="spacer"></span>
    <button class="pill" id="setIn" title="start the part here (I)">set start <kbd>I</kbd></button>
    <button class="pill" id="setOut" title="end the part here (O)">set end <kbd>O</kbd></button>
    <button class="pill" id="whole" title="skip trimming, save all of it">whole video</button>
    <button class="pill blue" id="save" title="save only the part between the handles (enter)" disabled>save this part <kbd>enter</kbd></button>
  </div>
  <div class="hint">space play · I / O set start and end at the playhead · ← → one second · shift ← → one frame · esc cancel</div>

<script>
'use strict';
const DATA = /*DATA*/null;
const $ = (id) => document.getElementById(id);
const video = $('video'), timeline = $('timeline');
const send = (m) => window.chrome.webview.postMessage(m);
const MIN = 0.1;                         // the shortest part, in seconds
let duration = 0, a = 0, b = 0, ready = false;

$('title').textContent = (DATA && DATA.title) || '';

function fmt(t) {
  t = Math.max(0, t || 0);
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  const ss = s.toFixed(1).padStart(4, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}
const pct = (t) => (duration ? (t / duration) * 100 : 0) + '%';

function draw() {
  $('knobIn').style.left = pct(a);
  $('knobOut').style.left = pct(b);
  $('range').style.left = pct(a);
  $('range').style.width = (duration ? ((b - a) / duration) * 100 : 0) + '%';
  $('head').style.left = pct(video.currentTime);
  $('tIn').textContent = fmt(a);
  $('tOut').textContent = fmt(b);
  $('tLen').textContent = fmt(b - a);
  $('playIcon').innerHTML = video.paused ? '<path d="M8 5.5v13l10.5-6.5z"/>' : '<path d="M8.5 5.5v13M15.5 5.5v13"/>';
}

function setDuration(d) {
  if (!(d > 0) || !isFinite(d)) return;
  const first = !duration;
  duration = d;
  if (first) { a = 0; b = d; }
  b = Math.min(b, d);
  ready = true;
  $('save').disabled = false;
  draw();
}

function load(src) {
  $('loading').classList.remove('gone');
  video.src = src;
}
if (DATA && DATA.duration > 0) setDuration(DATA.duration);

video.addEventListener('loadedmetadata', () => {
  setDuration(duration || video.duration);
  $('loading').classList.add('gone');
  video.classList.remove('hidden');
  video.currentTime = a;
});
video.addEventListener('error', () => { if (video.getAttribute('src')) send({ type: 'preview-failed' }); });
video.addEventListener('timeupdate', draw);
video.addEventListener('play', () => { if (video.currentTime >= b - 0.05) video.currentTime = a; tick(); });
video.addEventListener('pause', draw);
function tick() {                         // smooth playhead while playing; stops at the end handle
  if (video.paused) return;
  if (video.currentTime >= b) { video.pause(); video.currentTime = b; }
  draw();
  requestAnimationFrame(tick);
}

window.chrome.webview.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.type === 'info') { if (m.title) $('title').textContent = String(m.title); setDuration(Number(m.duration)); }
  if (m.type === 'src') load(String(m.src));
  if (m.type === 'status') $('status').textContent = String(m.text);
});

function seek(t) { video.currentTime = Math.max(0, Math.min(duration, t)); draw(); }
function setIn(t) { a = Math.max(0, Math.min(t, b - MIN)); draw(); }
function setOut(t) { b = Math.min(duration, Math.max(t, a + MIN)); draw(); }
function timeAt(x) { const r = timeline.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)) * duration; }

for (const [id, set] of [['knobIn', setIn], ['knobOut', setOut]]) {
  const knob = $(id);
  knob.addEventListener('pointerdown', (e) => {
    if (!ready) return;
    e.stopPropagation();
    knob.setPointerCapture(e.pointerId);
    knob.classList.add('drag');
    video.pause();
    const move = (ev) => { set(timeAt(ev.clientX)); seek(id === 'knobIn' ? a : b); };
    const up = () => { knob.classList.remove('drag'); knob.removeEventListener('pointermove', move); knob.removeEventListener('pointerup', up); };
    knob.addEventListener('pointermove', move);
    knob.addEventListener('pointerup', up);
  });
}
timeline.addEventListener('pointerdown', (e) => { if (ready) seek(timeAt(e.clientX)); });

$('play').addEventListener('click', () => { if (ready) video.paused ? video.play() : video.pause(); });
$('setIn').addEventListener('click', () => setIn(video.currentTime));
$('setOut').addEventListener('click', () => setOut(video.currentTime));
$('whole').addEventListener('click', () => send({ type: 'whole' }));
$('save').addEventListener('click', () => { if (ready) send({ type: 'save', start: a, end: b }); });

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'escape') return send({ type: 'cancel' });
  if (!ready) return;
  if (k === ' ') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  else if (k === 'i') setIn(video.currentTime);
  else if (k === 'o') setOut(video.currentTime);
  else if (k === 'arrowleft' || k === 'arrowright') { e.preventDefault(); video.pause(); seek(video.currentTime + (k === 'arrowleft' ? -1 : 1) * (e.shiftKey ? 1 / 30 : 1)); }
  else if (k === 'enter') send({ type: 'save', start: a, end: b });
});
document.addEventListener('contextmenu', (e) => e.preventDefault());
draw();
send({ type: 'ready' });
</script>
</body>
</html>
